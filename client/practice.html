<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComputingMaster - Practice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>ComputingMaster</h1>
        <p>Practice Mode</p>
    </header>

    <main>
        <div id="loading" class="card">
            <p>Loading questions...</p>
        </div>

        <div id="quiz-container" class="card" style="display: none;">
            <div class="quiz-header">
                <span id="progress">Question 1 of 4</span>
                <span id="topic-badge" class="badge">Web</span>
            </div>

            <h2 id="question-text"></h2>

            <div id="options-container" class="options"></div>

            <div id="feedback" class="feedback" style="display: none;"></div>

            <div class="quiz-actions">
                <button id="submit-btn" class="btn">Submit Answer</button>
                <button id="next-btn" class="btn" style="display: none;">Next Question</button>
            </div>
        </div>

        <div id="result-container" class="card" style="display: none;">
            <h2>Practice Complete!</h2>
            <p id="result-summary"></p>
            <a href="practice.html" class="btn">Practice Again</a>
            <a href="index.html" class="btn btn-secondary">Back to Home</a>
        </div>
    </main>

    <footer>
        <p>COMP3421 Final Project</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/practice.js"></script>
</body>
</html>
